# Render Blueprint: Dashboard → New → Blueprint → alegi repo-ul webui-tuborg-brasov.
# Fiecare push pe main face deploy automat.
services:
  - type: web
    name: webui-tuborg-brasov
    runtime: python
    plan: starter            # discul persistent nu e disponibil pe planul gratuit
    region: frankfurt
    branch: main
    autoDeploy: true
    buildCommand: "echo 'fara dependinte - doar biblioteca standard Python'"
    startCommand: "python3 server.py"
    healthCheckPath: /healthz
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: PYTHON_VERSION
        value: "3.12.7"
    disk:
      name: tuborg-data
      mountPath: /var/data
      sizeGB: 1
