<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#00562f">
<title>Tuborg Check-in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&display=swap">
<style>
  /* Inspirat din identitatea Tuborg: verde de sticla, alb, accent auriu de eticheta. */
  :root{
    --paper:#ffffff;
    --bg:#f2f6f3;
    --ink:#0e2418;
    --ink-soft:#5a6e62;
    --line:#d9e4dc;
    --green:#00562f;
    --green-mid:#007a3d;
    --green-soft:#e5f2ea;
    --gold:#e8c063;
    --gold-soft:#fbf2dc;
    --ok:#007a3d;
    --ok-soft:#dff1e6;
    --red:#c8102e;
    --font:"Inter","Helvetica Neue",Arial,sans-serif;
    color-scheme:light;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  /* fara zoom: blocheaza dublu-tap si pinch pe tablete */
  html{touch-action:pan-y; -webkit-text-size-adjust:100%; text-size-adjust:100%;}
  body{touch-action:pan-y;}
  button,input{touch-action:manipulation;}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--font); font-size:16px; -webkit-font-smoothing:antialiased;}
  [hidden]{display:none!important;}

  .top{background:var(--green); color:#fff; border-bottom:6px solid var(--gold); padding-top:env(safe-area-inset-top,0px);}
  .top-in{
    max-width:860px; margin:0 auto; display:flex; align-items:center; gap:22px;
    padding:22px max(20px, env(safe-area-inset-right,0px)) 22px max(20px, env(safe-area-inset-left,0px));
  }
  .top img{display:block; height:56px; width:auto;}
  .wordmark{font-size:34px; font-weight:800; font-style:italic; letter-spacing:-.02em; line-height:1; padding-right:20px; border-right:2px solid rgba(255,255,255,.25);}
  .ev{flex:1; min-width:0;}
  .ev .kick{font-size:13px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; color:var(--gold);}
  .ev h1{margin:4px 0 0; font-size:30px; line-height:1.15; font-weight:800; letter-spacing:-.01em; overflow-wrap:anywhere;}
  .ev .tag{margin-top:4px; font-size:14px; color:#b7d3c2; font-weight:500;}

  .page{
    min-height:calc(100% - 120px); display:flex; flex-direction:column; gap:20px;
    max-width:860px; margin:0 auto;
    padding-block:24px calc(18px + env(safe-area-inset-bottom,0px));
    padding-left:max(20px, env(safe-area-inset-left,0px));
    padding-right:max(20px, env(safe-area-inset-right,0px));
  }
  .alert{background:var(--red); color:#fff; border-radius:10px; padding:12px 16px; font-weight:600; font-size:15px;}

  .search{position:relative;}
  .search input{
    width:100%; font-family:var(--font); font-size:28px; font-weight:600; color:var(--ink);
    padding:20px 76px 20px 22px; border-radius:12px; border:3px solid var(--green);
    background:var(--paper); outline:none; -webkit-appearance:none; appearance:none;
  }
  .search input::-webkit-search-cancel-button,.search input::-webkit-search-decoration{-webkit-appearance:none; appearance:none; display:none;}
  .search input::placeholder{color:#9fb1a6; font-weight:400;}
  .search input:focus{box-shadow:0 0 0 5px rgba(232,192,99,.7);}
  .clear{
    position:absolute; right:12px; top:50%; transform:translateY(-50%);
    width:52px; height:52px; border-radius:10px; border:none; cursor:pointer;
    background:var(--green); color:#fff; font-size:30px; line-height:52px; padding:0;
  }
  .clear:active{transform:translateY(-50%) scale(.94);}

  .hint{color:var(--ink-soft); font-size:16px; padding:6px 4px;}
  .count{font-weight:800; font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-soft); padding:0 4px;}

  .results{display:flex; flex-direction:column; gap:10px; margin-top:10px;}
  .person{
    display:flex; align-items:center; gap:16px; padding:16px 14px 16px 20px;
    border:1px solid var(--line); border-radius:12px; background:var(--paper);
    box-shadow:0 1px 2px rgba(0,86,47,.06);
  }
  .person.in{background:var(--ok-soft); border-color:#b9dcc6;}
  .who{flex:1; min-width:0; display:flex; flex-direction:column; gap:7px;}
  .line1{display:flex; align-items:center; gap:12px; flex-wrap:wrap;}
  .name{font-size:24px; font-weight:700; line-height:1.2; overflow-wrap:anywhere;}
  .name mark{background:var(--gold); color:var(--ink); border-radius:3px; padding:0 1px;}
  .pax{flex:none; font-weight:800; font-size:15px; padding:5px 11px 4px; border-radius:999px; background:var(--green); color:#fff; white-space:nowrap;}
  .pax.big{background:var(--gold); color:var(--green); font-size:17px;}
  .detail{font-size:16px; color:var(--ink-soft); line-height:1.35; overflow-wrap:anywhere;}
  .dup{font-size:13px; color:#8a5a00; font-weight:600;}

  .stepper{display:flex; align-items:center; gap:10px; margin-top:2px; flex-wrap:wrap;}
  .stepper .t{font-weight:700; font-size:15px; color:var(--ok);}
  .stepper button{width:46px; height:46px; border-radius:10px; border:2px solid var(--ok); background:var(--paper); color:var(--ok); font:inherit; font-size:26px; font-weight:700; line-height:1; cursor:pointer; padding:0;}
  .stepper button:disabled{opacity:.35;}
  .stepper b{font-size:24px; font-weight:800; min-width:28px; text-align:center; font-variant-numeric:tabular-nums;}
  .stepper small{font-size:15px; color:var(--ink-soft);}

  .check{flex:none; display:flex; align-items:center; gap:12px; cursor:pointer; border:none; background:transparent; padding:6px; border-radius:12px; font:inherit; color:inherit;}
  .check:focus-visible{outline:3px solid var(--gold);}
  .box{width:58px; height:58px; border-radius:10px; border:3px solid var(--green); background:var(--paper); display:flex; align-items:center; justify-content:center; color:#fff; font-size:34px; font-weight:800;}
  .check .lbl{font-weight:800; font-size:14px; letter-spacing:.06em; text-transform:uppercase; color:var(--green); text-align:left; line-height:1.3; min-width:76px;}
  .person.in .box{background:var(--ok); border-color:var(--ok);}
  .person.in .lbl{color:var(--ok);}
  .lbl small{display:block; letter-spacing:0; text-transform:none; font-weight:500; font-size:13px; color:var(--ink-soft);}
  .check:active .box{transform:scale(.95);}

  .confirm{display:flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:flex-end;}
  .confirm span{font-weight:600;}
  .btn{font:inherit; font-weight:700; font-size:15px; border-radius:8px; padding:12px 16px; cursor:pointer; border:2px solid var(--green); background:var(--paper); color:var(--green);}
  .btn.red{background:var(--red); border-color:var(--red); color:#fff;}
  .btn:focus-visible{outline:3px solid var(--gold); outline-offset:2px;}
  .empty{padding:28px 6px; color:var(--ink-soft); font-size:17px;}

  footer{margin-top:auto; padding-top:22px; border-top:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;}
  .live{font-size:15px; color:var(--ink-soft); font-weight:500;}
  .live b{color:var(--green); font-weight:800; font-size:22px; font-variant-numeric:tabular-nums;}
  .stats-btn{font-family:var(--font); font-weight:800; font-size:14px; letter-spacing:.08em; text-transform:uppercase; padding:14px 22px; border-radius:8px; cursor:pointer; border:none; background:var(--gold); color:var(--green); display:flex; align-items:center; gap:10px;}
  .dot{width:10px; height:10px; border-radius:50%; background:var(--ok);}
  .dot.bad{background:var(--red);}

  .sheet-bg{position:fixed; inset:0; z-index:20; background:rgba(0,40,20,.5); display:flex; align-items:flex-end; justify-content:center;}
  .sheet{
    width:100%; max-width:620px; background:var(--paper); border-radius:18px 18px 0 0;
    padding-block:24px calc(24px + env(safe-area-inset-bottom,0px));
    padding-left:max(24px, env(safe-area-inset-left,0px)); padding-right:max(24px, env(safe-area-inset-right,0px));
    display:flex; flex-direction:column; gap:18px; max-height:92%; overflow:auto; border-top:6px solid var(--gold);
  }
  .sheet h2{margin:0; font-size:20px; font-weight:800; color:var(--green);}
  .sheet-head{display:flex; justify-content:space-between; align-items:center; gap:12px;}
  .stat{display:grid; grid-template-columns:1fr auto; gap:6px 12px; align-items:baseline;}
  .stat .k{font-weight:800; font-size:13px; letter-spacing:.12em; text-transform:uppercase; color:var(--green);}
  .stat .v{font-size:34px; font-weight:800; font-variant-numeric:tabular-nums;}
  .stat .v small{font-size:18px; color:var(--ink-soft); font-weight:500;}
  .bar{grid-column:1 / -1; height:8px; border-radius:4px; background:var(--line); overflow:hidden;}
  .bar i{display:block; height:100%; width:0; border-radius:4px; background:var(--ok); transition:width .35s ease;}
  .stat.inv .bar i{background:var(--gold);}
  .meta{font-size:14px; color:var(--ink-soft); line-height:1.5;}
  .admin{display:flex; gap:8px; flex-wrap:wrap; align-items:center; padding-top:14px; border-top:1px solid var(--line);}
  .admin input{font:inherit; font-size:16px; padding:11px 12px; border-radius:8px; border:2px solid var(--line); width:130px;}

  .toast{
    position:fixed; left:50%; z-index:30; top:calc(18px + env(safe-area-inset-top,0px));
    transform:translate(-50%,-16px); opacity:0; pointer-events:none; max-width:calc(100% - 40px);
    background:var(--green); color:#fff; padding:13px 20px; border-radius:10px; font-weight:600; text-align:center;
    border-bottom:4px solid var(--gold); transition:opacity .2s ease, transform .2s ease;
  }
  .toast.show{opacity:1; transform:translate(-50%,0);}

  @media (max-width:600px){
    .ev h1{font-size:22px;} .top img{height:40px;} .wordmark{font-size:24px; padding-right:14px;} .top-in{gap:14px;}
    .search input{font-size:22px; padding:16px 66px 16px 16px;}
    .clear{width:44px; height:44px; line-height:44px; font-size:26px;}
    .name{font-size:19px;}
    .box{width:50px; height:50px; font-size:28px;}
    .check .lbl{min-width:0; font-size:12px;}
    .person{padding:12px; gap:10px;}
  }
  @media (prefers-reduced-motion:reduce){ *{transition:none!important;} }
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <!-- logo oficial: puneti fisierul in static/logo.png; daca lipseste, apare textul Tuborg -->
    <img src="static/logo.png" alt="Tuborg" onerror="this.hidden=true; document.getElementById('wm').hidden=false">
    <div class="wordmark" id="wm" hidden>Tuborg</div>
    <div class="ev">
      <div class="kick" id="kick">Check-in invitați</div>
      <h1 id="evTitle">Brașov</h1>
      <div class="tag" id="evTag"></div>
    </div>
  </div>
</header>
<div class="page">
  <div class="alert" id="offline" hidden>Tableta nu se poate conecta la server. Bifările nu se salvează până revine conexiunea.</div>

  <div class="search">
    <input id="q" type="search" enterkeyhint="search" placeholder="Caută invitatul…" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="Caută invitatul">
    <button class="clear" id="clear" type="button" aria-label="Șterge căutarea" hidden>×</button>
  </div>

  <div id="out"><div class="hint">Se încarcă lista de invitați…</div></div>

  <footer>
    <div class="live" id="live"></div>
    <button class="stats-btn" id="statsBtn" type="button"><span class="dot" id="dot"></span>Statistici</button>
  </footer>
</div>

<div class="sheet-bg" id="statsBg" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="statsTitle">
    <div class="sheet-head">
      <h2 id="statsTitle">Statistici</h2>
      <button class="btn" id="statsClose" type="button">Închide</button>
    </div>
    <div class="stat"><div class="k">Persoane sosite</div><div class="v" id="vP">–</div><div class="bar"><i id="bP"></i></div></div>
    <div class="stat inv"><div class="k">Invitații bifate</div><div class="v" id="vI">–</div><div class="bar"><i id="bI"></i></div></div>
    <div class="meta">Tabletele se sincronizează la 2 secunde. Lista de invitați este fixă (din Excel).</div>
    <div class="admin">
      <input id="resetInput" type="text" placeholder="scrie RESET" autocomplete="off" autocapitalize="characters" aria-label="Confirmare resetare">
      <button class="btn red" id="resetBtn" type="button">Șterge toate bifările</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>

<script>
// Zoom dezactivat: iOS Safari ignora user-scalable=no, deci blocam si gesturile
(function(){
  function stop(e){ e.preventDefault(); }
  ["gesturestart","gesturechange","gestureend"].forEach(function(t){ document.addEventListener(t, stop, {passive:false}); });
  document.addEventListener("touchmove", function(e){ if (e.touches.length > 1 || (e.scale && e.scale !== 1)) e.preventDefault(); }, {passive:false});
  var lastTouch = 0;
  document.addEventListener("touchend", function(e){
    var now = Date.now();
    if (now - lastTouch < 350 && !(e.target.closest && e.target.closest("input,button"))) e.preventDefault();
    lastTouch = now;
  }, {passive:false});
  document.addEventListener("dblclick", stop, {passive:false});
  document.addEventListener("wheel", function(e){ if (e.ctrlKey) e.preventDefault(); }, {passive:false});
  document.addEventListener("keydown", function(e){ if ((e.ctrlKey || e.metaKey) && /^[=+\-0]$/.test(e.key)) e.preventDefault(); });
})();
</script>
<script>
(function(){
  "use strict";
  var POLL_MS = 2000, MIN_CHARS = 3;
  var guests = [], byId = {}, checkins = {}, version = 0, loaded = false, lastOk = 0;
  var query = "", pending = {}, confirmId = null;

  function $(id){ return document.getElementById(id); }
  function norm(s){
    s = String(s || "");
    if (s.normalize) s = s.normalize("NFD").replace(/[̀-ͯ]/g, "");
    return s.replace(/\s+/g," ").trim().toLowerCase();
  }
  function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]; }); }
  function hhmm(ts){ var d = new Date(ts); return ("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2); }
  function properCase(s){
    if (s !== s.toLowerCase() && s !== s.toUpperCase()) return s;
    return s.toLowerCase().replace(/(^|[\s\-])(\S)/g, function(m,a,b){ return a + b.toUpperCase(); });
  }
  function pers(n){ return n === 1 ? "1 persoană" : n + " persoane"; }
  var toastT;
  function toast(msg){
    var t = $("toast"); t.textContent = msg; t.className = "toast show";
    clearTimeout(toastT); toastT = setTimeout(function(){ t.className = "toast"; }, 2400);
  }

  function req(method, path, body){
    if (window.TUBORG_MOCK) return window.TUBORG_MOCK(method, path, body);
    return new Promise(function(resolve, reject){
      var x = new XMLHttpRequest();
      x.open(method, path, true);
      x.timeout = 8000;
      x.setRequestHeader("Content-Type", "application/json");
      x.onload = function(){
        if (x.status >= 200 && x.status < 300){ try { resolve(JSON.parse(x.responseText)); } catch(e){ reject(e); } }
        else { var er = new Error("HTTP " + x.status); er.status = x.status; reject(er); }
      };
      x.onerror = function(){ reject(new Error("retea")); };
      x.ontimeout = function(){ reject(new Error("timeout")); };
      x.send(body ? JSON.stringify(body) : null);
    });
  }

  function apply(s){
    lastOk = Date.now();
    $("offline").hidden = true; $("dot").className = "dot";
    if (s.guests){
      guests = s.guests.map(function(g){
        var name = properCase(g.name);
        return {id:g.id, row:g.row, name:name, detail:g.detail || "", count:g.count || 1,
                nk:norm(name), key:norm(name + " " + (g.detail || ""))};
      });
      var groups = {};
      guests.forEach(function(g){ var k = g.nk.replace(/-/g, " ").split(" ").filter(Boolean).sort().join(" "); g.gk = k; groups[k] = (groups[k] || 0) + 1; });
      guests.forEach(function(g){ g.dup = groups[g.gk] > 1 ? groups[g.gk] : 0; });
      guests.sort(function(a,b){ return a.nk < b.nk ? -1 : a.nk > b.nk ? 1 : a.row - b.row; });
      byId = {}; guests.forEach(function(g){ byId[g.id] = g; });
      $("evTitle").textContent = s.title || "Brașov";
      $("kick").textContent = s.subtitle || "Check-in invitați";
      $("evTag").textContent = "Check-in invitați";
      document.title = "Tuborg Check-in · " + (s.title || "Brașov");
      loaded = true;
    }
    if (s.guests || s.version !== version){
      version = s.version;
      checkins = s.checkins || {};
      render();
    }
    stats();
  }

  function poll(){
    req("GET", "/api/state" + (loaded ? "" : "?full=1"))
      .then(apply)
      .then(function(){ setTimeout(poll, POLL_MS); }, function(){
        if (Date.now() - lastOk > 6000){ $("offline").hidden = false; $("dot").className = "dot bad"; }
        setTimeout(poll, POLL_MS);
      });
  }

  function highlight(name, tokens){
    var n = norm(name);
    if (!tokens.length || n.length !== name.length) return esc(name);
    var m = []; for (var i = 0; i < name.length; i++) m.push(false);
    tokens.forEach(function(t){ var f = 0, k; while ((k = n.indexOf(t, f)) >= 0){ for (var j = k; j < k + t.length; j++) m[j] = true; f = k + 1; } });
    var out = "", open = false;
    for (var c = 0; c < name.length; c++){
      if (m[c] && !open){ out += "<mark>"; open = true; }
      if (!m[c] && open){ out += "</mark>"; open = false; }
      out += esc(name[c]);
    }
    return out + (open ? "</mark>" : "");
  }

  function render(){
    var out = $("out");
    var tokens = norm(query).split(" ").filter(Boolean);
    if (tokens.join("").length < MIN_CHARS){
      out.innerHTML = '<div class="hint">' + (loaded ? "Scrie cel puțin 3 litere din nume sau prenume." : "Se încarcă lista de invitați…") + "</div>";
      return;
    }
    var res = guests.filter(function(g){
      for (var i = 0; i < tokens.length; i++) if (g.key.indexOf(tokens[i]) < 0) return false;
      return true;
    });
    if (!res.length){
      out.innerHTML = '<div class="empty">Nu am găsit pe nimeni pentru „' + esc(query.trim()) + '”. Verifică ortografia sau caută după celălalt nume.</div>';
      return;
    }
    var h = ['<div class="count">' + res.length + (res.length === 1 ? " rezultat" : " rezultate") + '</div><div class="results">'];
    res.forEach(function(g){
      var ci = checkins[g.id], act, step = "";
      if (ci && confirmId === g.id){
        act = '<div class="confirm"><span>Debifezi?</span><button class="btn red" data-act="undo" type="button">Da, debifează</button><button class="btn" data-act="keep" type="button">Nu</button></div>';
      } else if (ci){
        act = '<button class="check" data-act="ask" type="button" aria-label="Debifează ' + esc(g.name) + '"><span class="box">✓</span><span class="lbl">A venit<small>la ' + hhmm(ci.ts) + '</small></span></button>';
      } else {
        act = '<button class="check" data-act="in" type="button" aria-label="Bifează ' + esc(g.name) + ' ca venit"><span class="box"></span><span class="lbl">A venit?</span></button>';
      }
      if (ci && g.count > 1){
        var n = ci.n || g.count;
        step = '<div class="stepper"><span class="t">Au intrat:</span><button type="button" data-act="minus" aria-label="Mai puțini"' + (n <= 1 ? " disabled" : "") + '>−</button><b>' + n + '</b><button type="button" data-act="plus" aria-label="Mai mulți"' + (n >= g.count ? " disabled" : "") + '>+</button><small>din ' + g.count + '</small></div>';
      }
      h.push('<div class="person' + (ci ? " in" : "") + '" data-id="' + esc(g.id) + '"><div class="who">' +
        '<div class="line1"><div class="name">' + highlight(g.name, tokens) + '</div>' + '<span class="pax' + (g.count > 2 ? " big" : "") + '">' + pers(g.count) + '</span></div>' +
        (g.detail ? '<div class="detail">' + esc(g.detail) + '</div>' : '') +
        (g.dup ? '<div class="dup">Numele apare de ' + g.dup + ' ori în listă (invitații separate).</div>' : '') +
        step + '</div>' + act + '</div>');
    });
    h.push("</div>");
    out.innerHTML = h.join("");
  }

  function stats(){
    var inv = [0, guests.length], ppl = [0, 0];
    guests.forEach(function(g){ ppl[1] += g.count; var c = checkins[g.id]; if (c){ inv[0]++; ppl[0] += c.n || g.count; } });
    function pct(a){ return (a[1] ? Math.min(100, a[0] * 100 / a[1]) : 0) + "%"; }
    $("vP").innerHTML = ppl[0] + " <small>din " + ppl[1] + "</small>"; $("bP").style.width = pct(ppl);
    $("vI").innerHTML = inv[0] + " <small>din " + inv[1] + "</small>"; $("bI").style.width = pct(inv);
    $("live").innerHTML = loaded ? "Au venit <b>" + ppl[0] + "</b> din " + ppl[1] + " persoane" : "";
  }

  function local(id, val){
    var copy = {}; for (var k in checkins) copy[k] = checkins[k];
    if (val) copy[id] = val; else delete copy[id];
    checkins = copy; render(); stats();
  }

  function send(id, path, body, optimistic, okMsg){
    if (pending[id]) return;
    pending[id] = true;
    var prev = checkins[id];
    confirmId = null; local(id, optimistic);
    req("POST", path, body)
      .then(function(s){
        delete pending[id];
        if (!s.ok && path === "/api/checkin") toast(byId[id].name + " era deja bifat(ă) de pe altă tabletă");
        else if (okMsg) toast(okMsg);
        version = -1; apply(s);
      })
      .catch(function(){
        delete pending[id];
        local(id, prev);
        toast("Nu s-a salvat: fără conexiune. Încearcă din nou.");
      });
  }

  $("out").addEventListener("click", function(e){
    var b = e.target.closest ? e.target.closest("button") : null; if (!b) return;
    var row = b.closest(".person"); if (!row) return;
    var id = row.getAttribute("data-id"), a = b.getAttribute("data-act"), g = byId[id], c = checkins[id];
    if (a === "in") send(id, "/api/checkin", {id:id}, {ts:Date.now(), n:g.count}, "✓ " + g.name + (g.count > 1 ? " (" + pers(g.count) + ")" : "") + " a venit");
    else if (a === "undo") send(id, "/api/undo", {id:id}, null, "Debifat: " + g.name);
    else if (a === "ask"){ confirmId = id; render(); }
    else if (a === "keep"){ confirmId = null; render(); }
    else if ((a === "minus" || a === "plus") && c){
      var n = Math.max(1, Math.min(g.count, (c.n || g.count) + (a === "plus" ? 1 : -1)));
      send(id, "/api/count", {id:id, n:n}, {ts:c.ts, n:n});
    }
  });

  var q = $("q");
  q.addEventListener("input", function(){ query = q.value; confirmId = null; $("clear").hidden = !query; render(); });
  q.addEventListener("keydown", function(e){ if (e.key === "Enter") q.blur(); });
  $("clear").addEventListener("click", function(){ q.value = ""; query = ""; confirmId = null; $("clear").hidden = true; render(); q.focus(); });

  function openStats(o){ $("statsBg").hidden = !o; if (o){ stats(); $("statsClose").focus(); } }
  $("statsBtn").addEventListener("click", function(){ openStats(true); });
  $("statsClose").addEventListener("click", function(){ openStats(false); });
  $("statsBg").addEventListener("click", function(e){ if (e.target === this) openStats(false); });
  document.addEventListener("keydown", function(e){ if (e.key === "Escape") openStats(false); });

  $("resetBtn").addEventListener("click", function(){
    var inp = $("resetInput");
    if (inp.value.trim().toUpperCase() !== "RESET"){ toast("Scrie RESET în câmp ca să confirmi"); inp.focus(); return; }
    req("POST", "/api/reset", {confirm:"RESET"})
      .then(function(s){ inp.value = ""; version = -1; apply(s); toast("Toate bifările au fost șterse"); })
      .catch(function(){ toast("Fără conexiune: resetarea nu s-a făcut"); });
  });

  render();
  poll();
})();
</script>
</body>
</html>
